name: Windows release candidate
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m venv .venv
      - run: .venv/Scripts/python -m pip install -r requirements-lock.txt
      - run: .venv/Scripts/python -m pip install --no-deps -e .
      - run: npm ci --prefix desktop
      - uses: actions/cache@v4
        with:
          path: |
            models/ocr
            artifacts/toolchain
          key: windows-build-${{ hashFiles('resources/models.json','resources/windows-toolchain.json') }}
      - run: ./scripts/build-windows.ps1
        shell: pwsh
      - run: .venv/Scripts/python -m scripts.smoke_frozen_workers
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-release-candidate
          path: |
            artifacts/release/*
            artifacts/frozen-worker-results.json
      # Publishing is a separate reviewed action. A package build is not evidence
      # of native installation, independent image acceptance, or calendar sync.
