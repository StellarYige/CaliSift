name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    name: Core and local storage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest --ignore=tests/test_ocr.py
      - run: npm ci --prefix desktop
      - run: npm test --prefix desktop
      - run: npm run build:desktop
      - run: npm test
  real-ocr:
    name: Real OCR and full coverage (Windows)
    runs-on: windows-latest
    env:
      CALISIFT_REQUIRE_OCR: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps -e .
      - uses: actions/cache@v4
        with:
          path: models/ocr
          key: ocr-${{ hashFiles('resources/models.json') }}
      - run: python -m scripts.install_ocr
      - run: python -m pytest --cov=xingcheng --cov-branch --cov-report=xml --cov-fail-under=90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage
          path: coverage.xml
