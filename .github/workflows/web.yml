name: Web checks and Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest
      - run: npm ci --prefix web
      - uses: actions/cache@v4
        with:
          path: |
            web/public/runtime
            web/public/models
            web/public/wheels
          key: browser-runtime-${{ hashFiles('resources/web-runtime-lock.json') }}
      - run: npm test
      - run: npm run build
      - run: node web/node_modules/playwright/cli.js install chrome msedge firefox
      - run: npm run test:browser
      - run: npm run package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: |
            artifacts/web-browser-results.json
            artifacts/web-*.png
            web/test-results
      - uses: actions/upload-artifact@v4
        with:
          name: calisift-static-web
          path: |
            artifacts/CaliSift-web-*.zip
            artifacts/CaliSift-web-*.sha256
      - name: Stage the tested site and public self-hosting downloads
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/pages/downloads -Force | Out-Null
          Copy-Item -Path web/dist/* -Destination artifacts/pages -Recurse
          Copy-Item -Path artifacts/CaliSift-web-* -Destination artifacts/pages/downloads
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/pages
  container-check:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: calisift-static-web
          path: artifacts
      - run: sha256sum --check *.sha256
        working-directory: artifacts
      - run: unzip -q artifacts/CaliSift-web-*.zip -d bundle
      - run: docker compose -f bundle/compose.yaml up --build -d
      - run: python scripts/verify-static.py --dist bundle/web/dist http://127.0.0.1:8080/ http://127.0.0.1:8080/CaliSift/ > container-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: container-verification
          path: container-verification.json
      - if: always()
        run: docker compose -f bundle/compose.yaml down
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [check, container-check]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested static files
        id: deployment
        uses: actions/deploy-pages@v4
  production-check:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: calisift-static-web
          path: artifacts
      - run: unzip -q artifacts/CaliSift-web-*.zip -d bundle
      - run: python scripts/verify-static.py --dist bundle/web/dist https://stellaryige.github.io/CaliSift/ > artifacts/web-production-static.json
      - run: npm ci --prefix web
      - run: node web/node_modules/playwright/cli.js install chrome
      - run: node scripts/smoke-web.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-verification
          path: artifacts/web-production*
