name: Reproduction / bug report
description: Report a reproducible problem without private schedule data.
body:
  - type: input
    id: version
    attributes:
      label: CaliSift version and OS
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps and expected result
      description: Use the example name 星辰奕歌. Do not attach private rosters or images.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result / error message
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Shared data
      options:
        - label: Any attached files are sanitized and I have permission to share them publicly.
          required: true
