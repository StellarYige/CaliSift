[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "calisift"
version = "0.3.0a2"
description = "Local, verifiable personal calendars from rosters, spreadsheets and screenshots."
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.13.5", "openpyxl==3.1.5", "xlrd==2.0.2", "defusedxml==0.7.1"
]

[project.optional-dependencies]
api = ["fastapi==0.135.1", "uvicorn==0.42.0", "python-multipart==0.0.22"]
desktop = ["pywebview==6.2.1", "platformdirs==4.11.7", "pillow==11.3.0"]
build = ["pyinstaller==6.22.2"]
ocr = ["rapidocr==3.4.2", "onnxruntime==1.23.2", "opencv-python==4.11.0.86", "pillow==11.3.0"]
test = ["pytest==9.0.2", "pytest-cov==7.0.0", "httpx==0.28.1", "xlwt==1.3.0"]

[project.scripts]
calisift = "xingcheng.cli:main"
calisift-worker = "xingcheng.desktop_worker:main"

[project.gui-scripts]
calisift-desktop = "xingcheng.desktop:launch"

[project.urls]
Repository = "https://github.com/StellarYige/CaliSift"
Issues = "https://github.com/StellarYige/CaliSift/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
