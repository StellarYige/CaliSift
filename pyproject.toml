[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "calisift"
version = "0.4.0a1"
description = "Local, verifiable personal calendars from rosters, spreadsheets and screenshots."
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.12.5", "openpyxl==3.1.5", "xlrd==2.0.2", "defusedxml==0.7.1"
]

[project.optional-dependencies]
test = ["pytest==9.0.2", "pytest-cov==7.0.0", "xlwt==1.3.0", "pillow==11.3.0", "opencv-python==4.11.0.86", "numpy==2.2.6"]

[project.urls]
Repository = "https://github.com/StellarYige/CaliSift"
Issues = "https://github.com/StellarYige/CaliSift/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
